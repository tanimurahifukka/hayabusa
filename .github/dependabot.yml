version: 2
updates:
  # Swift Package Manager dependencies (Package.swift / Package.resolved).
  # Dependabot supports the "swift" ecosystem; it opens PRs to bump pinned
  # versions in Package.resolved when upstream tags are released.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions used by the CI / Release / Security workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
