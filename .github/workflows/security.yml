name: Security

on:
  push:
    branches:
      - main
  pull_request:

# Permissions are scoped to the minimum needed. The secret-scan job only reads
# repository contents (gitleaks scans the checked-out history / diff).
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    # Secret scanning is OS-independent, so run on Linux (faster / cheaper than
    # the macOS runners the build jobs require).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks needs the full history to scan all commits on push events.
          # For pull_request events the action scans only the PR commit range.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE is required for public repositories; the action
          # uses the bundled default ruleset. Add a .gitleaks.toml at the repo
          # root to customize allowlists or rules.
