name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Build gate: there are currently no automated tests in this repository, so a
# successful `swift build` is used as the merge gate. Replace/extend with
# `swift test` once a test target exists.
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # mlx-swift-lm requires Swift 6.1 (Xcode 16.3+). Use the latest stable
          # Xcode available on macos-15 so the MLX SwiftPM deps resolve/build.
          xcode-version: 'latest-stable'

      - name: Clone llama.cpp
        run: |
          # Keep org / pinned SHA in sync with README.md "Build llama.cpp"
          # and the Release workflow.
          LLAMA_CPP_REF=c9872a2575acc65834deb15a1f5155f6dbc75229
          mkdir -p vendor
          git clone https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          cd vendor/llama.cpp
          git checkout "$LLAMA_CPP_REF"

      - name: Build llama.cpp (Metal)
        run: |
          # BUILD_SHARED_LIBS=OFF matches README (static linking; Package.swift
          # links the .a artifacts from build/src and build/ggml/src/*).
          cd vendor/llama.cpp
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_METAL=ON \
            -DGGML_BLAS=ON \
            -DGGML_BLAS_VENDOR=Apple \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL_EMBED_LIBRARY=ON
          cmake --build . --config Release -j $(sysctl -n hw.ncpu)

      - name: Build Hayabusa server
        run: |
          swift build

      - name: Build HayabusaApp GUI
        run: |
          cd HayabusaApp
          swift build
